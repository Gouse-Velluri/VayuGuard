name: CI

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.env.example'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mern-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mern-frontend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx next lint --max-warnings 0

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css,md}"

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: mern-backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vayuguard_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mern-backend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        env:
          POSTGRES_URI: postgresql://test:test@localhost:5432/vayuguard_test
        run: |
          psql "$POSTGRES_URI" -f ../data-pipeline/sql/migrations/001_initial.sql || true
          psql "$POSTGRES_URI" -f ../data-pipeline/sql/migrations/002_add_alerts.sql || true

      - name: Run unit tests
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://test:test@localhost:27017/vayuguard_test?authSource=admin
          POSTGRES_URI: postgresql://test:test@localhost:5432/vayuguard_test
          JWT_SECRET: test-jwt-secret-for-ci
          ML_SERVICE_URL: http://localhost:8000
          PORT: 5000
        run: npm run test:coverage

      - name: Run integration tests
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://test:test@localhost:27017/vayuguard_test?authSource=admin
          POSTGRES_URI: postgresql://test:test@localhost:5432/vayuguard_test
          JWT_SECRET: test-jwt-secret-for-ci
          ML_SERVICE_URL: http://localhost:8000
          PORT: 5000
        run: npm run test:integration

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: mern-backend/coverage/

  test-ml-service:
    name: Test ML Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run model tests
        run: python -m pytest tests/test_models.py -v --cov=models --cov-report=term-missing

      - name: Run inference tests
        run: python -m pytest tests/test_inference.py -v --cov=inference --cov-report=term-missing

      - name: Run integration tests
        run: python -m pytest tests/test_integration.py -v --cov --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: ml-coverage
          path: ml-service/coverage.xml

  check-data-pipeline:
    name: Check Data Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-pipeline
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vayuguard_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run ingestion tests
        env:
          POSTGRES_URI: postgresql://test:test@localhost:5432/vayuguard_test
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python -m pytest tests/test_ingestion.py -v --cov=ingestion

      - name: Run quality check tests
        run: python -m pytest tests/test_quality_checks.py -v --cov=cleaning

      - name: Run analytics tests
        run: python -m pytest tests/test_analytics.py -v --cov=analytics

      - name: Validate SQL migrations
        env:
          POSTGRES_URI: postgresql://test:test@localhost:5432/vayuguard_test
        run: |
          psql "$POSTGRES_URI" -f sql/migrations/001_initial.sql
          psql "$POSTGRES_URI" -f sql/migrations/002_add_alerts.sql
          echo "SQL migrations validated successfully"
