# =============================================================================
# VayuGuard - Docker Compose Orchestration
# =============================================================================
# Complete stack: frontend, backend, ml-service, databases, and monitoring
# =============================================================================

version: "3.9"

# --------------- Shared Networks ---------------
networks:
  vayuguard-frontend:
    driver: bridge
    name: vayuguard-frontend
  vayuguard-backend:
    driver: bridge
    name: vayuguard-backend
  vayuguard-monitoring:
    driver: bridge
    name: vayuguard-monitoring

# --------------- Shared Volumes ---------------
volumes:
  mongodb-data:
    driver: local
    name: vayuguard-mongodb
  postgres-data:
    driver: local
    name: vayuguard-postgres
  redis-data:
    driver: local
    name: vayuguard-redis
  ml-models:
    driver: local
    name: vayuguard-ml-models
  prometheus-data:
    driver: local
    name: vayuguard-prometheus
  grafana-data:
    driver: local
    name: vayuguard-grafana
  backend-logs:
    driver: local
    name: vayuguard-backend-logs

# --------------- Services ---------------
services:

  # ===== Frontend (Next.js + Nginx) =====
  frontend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.mern-frontend
    container_name: vayuguard-frontend
    ports:
      - "3000:3000"
    networks:
      - vayuguard-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_ML_API_URL=/api/ml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"

  # ===== Backend (Express.js) =====
  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.mern-backend
    container_name: vayuguard-backend
    ports:
      - "5000:5000"
    networks:
      - vayuguard-frontend
      - vayuguard-backend
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/vayuguard
      - DATABASE_URL=postgresql://vayuguard:vayuguard@postgres:5432/vayuguard
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=${JWT_SECRET:-vayuguard-secret-change-me}
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

  # ===== ML Service (FastAPI + Python) =====
  ml-service:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.ml
    container_name: vayuguard-ml-service
    ports:
      - "8000:8000"
    networks:
      - vayuguard-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://vayuguard:vayuguard@postgres:5432/vayuguard_ml
      - REDIS_URL=redis://redis:6379
      - MODEL_PATH=/app/models
      - LOG_LEVEL=INFO
      - WORKERS=4
    volumes:
      - ml-models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"

  # ===== MongoDB =====
  mongodb:
    image: mongo:7.0-jammy
    container_name: vayuguard-mongodb
    ports:
      - "27017:27017"
    networks:
      - vayuguard-backend
    environment:
      - MONGO_INITDB_ROOT_USERNAME=vayuguard
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-vayuguard-mongo-secret}
      - MONGO_INITDB_DATABASE=vayuguard
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.25"

  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: vayuguard-postgres
    ports:
      - "5432:5432"
    networks:
      - vayuguard-backend
    environment:
      - POSTGRES_USER=vayuguard
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vayuguard-pg-secret}
      - POSTGRES_DB=vayuguard
      - POSTGRES_MULTIPLE_DATABASES=vayuguard,vayuguard_ml
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayuguard -d vayuguard"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: vayuguard-redis
    ports:
      - "6379:6379"
    networks:
      - vayuguard-backend
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"

  # ===== Prometheus =====
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: vayuguard-prometheus
    ports:
      - "9090:9090"
    networks:
      - vayuguard-backend
      - vayuguard-monitoring
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.1"

  # ===== Grafana =====
  grafana:
    image: grafana/grafana:10.3.3
    container_name: vayuguard-grafana
    ports:
      - "3001:3000"
    networks:
      - vayuguard-monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-vayuguard-grafana-secret}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
